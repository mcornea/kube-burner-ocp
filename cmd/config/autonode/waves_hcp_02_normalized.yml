# Delay between waves
delay: 30s
# Control-plane stress objects per namespace
# Scaled for ~22 pods/wave avg (1000 pods / 45 waves)
stress:
  secrets: 22
  configmaps: 22
  services: 11
  routes: 5
  networkPolicies: 3
# Normalized wave sizes for predictable churn behavior.
# Repeating m5.xlarge → m5.8xlarge cycle (6+12+24+48 = 90 pods/cycle).
# 11 full cycles = 990 pods + 10 remaining = 1000 pods total, 500 cores
waves:
# Cycle 1
- pods: 6
  cpuRequest: "500m"    # 1 x m5.xlarge (4 vCPU)
- pods: 12
  cpuRequest: "500m"    # 1 x m5.2xlarge (8 vCPU)
- pods: 24
  cpuRequest: "500m"    # 1 x m5.4xlarge (16 vCPU)
- pods: 48
  cpuRequest: "500m"    # 1 x m5.8xlarge (32 vCPU)
