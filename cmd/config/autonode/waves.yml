# Delay between waves
delay: 30s
# Each wave targets a specific m5 instance type via CPU requests
# Total: 100 pods, 50 cores
waves:
- pods: 6
  cpuRequest: "500m"    # 1 x m5.xlarge (4 vCPU)
- pods: 12
  cpuRequest: "500m"    # 1 x m5.2xlarge (8 vCPU)
- pods: 24
  cpuRequest: "500m"    # 1 x m5.4xlarge (16 vCPU)
- pods: 48
  cpuRequest: "500m"    # 1 x m5.8xlarge (32 vCPU)
- pods: 10
  cpuRequest: "500m"    # remaining to 100 pods
