# Delay between waves
delay: 30s
# Control-plane stress objects per namespace
# Stress per namespace aligned with cluster-density-v2
stress:
  secrets: 10
  configmaps: 10
  services: 5
  routes: 2
  networkPolicies: 3
# Required NodePools:
#   autonode-compute: c6i.xlarge, c6i.2xlarge, c6i.4xlarge
#   autonode-general: m6i.xlarge, m6i.2xlarge, m6i.4xlarge
#   autonode-memory:  r6i.xlarge, r6i.2xlarge, r6i.4xlarge
#
# Repeating xlarge → 2xlarge → 4xlarge cycle across 3 families
# (60+120+240) x 3 families = 1260 pods/cycle
# 8 full cycles = 10080 pods total, 5040 cores
waves:
# Cycle 1
- pods: 60
  cpuRequest: "500m"
  nodepool: autonode-compute
- pods: 60
  cpuRequest: "500m"
  nodepool: autonode-general
- pods: 60
  cpuRequest: "500m"
  nodepool: autonode-memory
- pods: 120
  cpuRequest: "500m"
  nodepool: autonode-compute
