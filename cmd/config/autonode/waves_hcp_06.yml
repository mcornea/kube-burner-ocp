# Multi-instance-type churn config targeting c6i, m6i, and r6i families
# Based on waves_hcp_02_normalized.yml pattern with repeating cycles.
# Uses separate NodePools per instance family with nodeSelector.
#
# Required NodePools:
#   autonode-compute: c6i.xlarge, c6i.2xlarge, c6i.4xlarge
#   autonode-general: m6i.xlarge, m6i.2xlarge, m6i.4xlarge
#   autonode-memory:  r6i.xlarge, r6i.2xlarge, r6i.4xlarge
#
# Repeating xlarge → 2xlarge → 4xlarge cycle across 3 families
# (6+12+24) x 3 families = 126 pods/cycle
# 8 full cycles = 1008 pods total, 504 cores
delay: 30s
# Stress per namespace aligned with cluster-density-v2
stress:
  secrets: 10
  configmaps: 10
  services: 5
  routes: 2
  networkPolicies: 3
waves:
# Cycle 1
- pods: 6
  cpuRequest: "500m"
  nodepool: autonode-compute     # c6i.xlarge
- pods: 6
  cpuRequest: "500m"
  nodepool: autonode-general      # m6i.xlarge
- pods: 6
  cpuRequest: "500m"
  nodepool: autonode-memory       # r6i.xlarge
- pods: 12
  cpuRequest: "500m"
  nodepool: autonode-compute     # c6i.2xlarge
- pods: 12
  cpuRequest: "500m"
  nodepool: autonode-general      # m6i.2xlarge
- pods: 12
  cpuRequest: "500m"
  nodepool: autonode-memory       # r6i.2xlarge
- pods: 24
  cpuRequest: "500m"
  nodepool: autonode-compute     # c6i.4xlarge
- pods: 24
  cpuRequest: "500m"
  nodepool: autonode-general      # m6i.4xlarge
- pods: 24
  cpuRequest: "500m"
  nodepool: autonode-memory       # r6i.4xlarge
