# Delay between waves
delay: 30s
# Control-plane stress objects per namespace
# Scaled for ~100 pods/wave avg
stress:
  secrets: 22
  configmaps: 22
  services: 11
  routes: 5
  networkPolicies: 3
# Required NodePools:
#   autonode-compute: c6i.xlarge, c6i.2xlarge, c6i.4xlarge
#   autonode-general: m6i.xlarge, m6i.2xlarge, m6i.4xlarge
#   autonode-memory:  r6i.xlarge, r6i.2xlarge, r6i.4xlarge
#
# Repeating xlarge → 2xlarge → 4xlarge cycle across 3 families
# (6+12+24) x 3 families = 126 pods/cycle
# 8 full cycles = 1008 pods total, 504 cores
waves:
# Cycle 1
- pods: 6
  cpuRequest: "500m"
  nodepool: autonode-compute
- pods: 6
  cpuRequest: "500m"
  nodepool: autonode-general
- pods: 6
  cpuRequest: "500m"
  nodepool: autonode-memory
