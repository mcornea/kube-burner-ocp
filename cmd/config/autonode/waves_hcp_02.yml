# Delay between waves
delay: 30s
# Control-plane stress objects per namespace
# Scaled for ~100 pods/wave avg (1000 pods / 10 waves)
stress:
  secrets: 100
  configmaps: 100
  services: 50
  routes: 20
  networkPolicies: 3
# Each wave fits on a single node (m5.xlarge - m5.8xlarge)
# Total: 1000 pods, 500 cores
waves:
- pods: 6
  cpuRequest: "500m"    # 1 x m5.xlarge (4 vCPU)
- pods: 12
  cpuRequest: "500m"    # 1 x m5.2xlarge (8 vCPU)
- pods: 24
  cpuRequest: "500m"    # 1 x m5.4xlarge (16 vCPU)
- pods: 48
  cpuRequest: "500m"    # 1 x m5.8xlarge (32 vCPU)
- pods: 6
  cpuRequest: "500m"    # 1 x m5.xlarge (4 vCPU)
- pods: 12
  cpuRequest: "500m"    # 1 x m5.2xlarge (8 vCPU)
- pods: 24
  cpuRequest: "500m"    # 1 x m5.4xlarge (16 vCPU)
- pods: 48
  cpuRequest: "500m"    # 1 x m5.8xlarge (32 vCPU)
- pods: 48
  cpuRequest: "500m"    # 1 x m5.8xlarge (32 vCPU)
- pods: 772
  cpuRequest: "500m"    # remaining to 1000 pods
