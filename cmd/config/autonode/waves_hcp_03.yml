# Delay between waves
delay: 30s
# Control-plane stress objects per namespace
# Scaled for ~111 pods/wave avg
stress:
  secrets: 110
  configmaps: 110
  services: 55
  routes: 22
  networkPolicies: 3
# Required NodePools:
#   autonode-compute: c6i.xlarge, c6i.2xlarge, c6i.4xlarge
#   autonode-general: m6i.xlarge, m6i.2xlarge, m6i.4xlarge
#   autonode-memory:  r6i.xlarge, r6i.2xlarge, r6i.4xlarge
#
# Repeating xlarge → 2xlarge → 4xlarge cycle across 3 families
# (12+24+48) x 3 families = 252 pods/cycle
# 8 full cycles = 2016 pods total, 1008 cores
waves:
# Cycle 1
- pods: 12
  cpuRequest: "500m"
  nodepool: autonode-compute
- pods: 12
  cpuRequest: "500m"
  nodepool: autonode-general
