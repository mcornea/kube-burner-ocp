# Delay between waves
delay: 30s
# Control-plane stress objects per namespace
# Stress per namespace aligned with cluster-density-v2
stress:
  secrets: 10
  configmaps: 10
  services: 5
  routes: 2
  networkPolicies: 3
# Required NodePools (2xlarge only):
#   autonode-compute: c6i.2xlarge
#   autonode-general: m6i.2xlarge
#   autonode-memory:  r6i.2xlarge
#
# Each wave creates ~8 x 2xlarge nodes (111 pods x 500m = 55.5 cores)
# 21 cycles x 3 families x ~8 nodes/wave = ~500 nodes
# 21 cycles x 3 waves = 63 waves, 6993 pods total, 3496.5 cores
waves:
# Cycle 1
- pods: 111
  cpuRequest: "500m"
  nodepool: autonode-compute
- pods: 111
  cpuRequest: "500m"
  nodepool: autonode-general
- pods: 111
  cpuRequest: "500m"
  nodepool: autonode-memory
