- pods: 12
  cpuRequest: "500m"
  nodepool: autonode-r6i-2xlarge
- pods: 24
  cpuRequest: "500m"
  nodepool: autonode-c6i-4xlarge
- pods: 24
  cpuRequest: "500m"
  nodepool: autonode-m6i-4xlarge
- pods: 24
  cpuRequest: "500m"
  nodepool: autonode-r6i-4xlarge
